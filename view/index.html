<!DOCTYPE html> <!--Declara que este documento segue o padão HTML 5-->
<html lang="pt-BR"> <!--Define como idioma principal do documento como Portugues do Brasil-->

    <head> <!--Cabeçalho do documento contendo metadados e links externos-->
        <meta charset="UTF-8"> <!--Define a codificação de caracteres UTF-8 como suporte a acentos-->
        <meta name="viewport" content="width=devide-width, initial-scale=1.0"> <!--Garante suporte a telas responsivas em dispositivos móveis-->
        <title>Tarefas App</title> <!--Define o título que aparece na aba do navegador-->
        <!--Link de importação dda folha de estilos (CSS) do bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head> <!--Fechamento da seção de metadados-->

    <body> <!--Corpo da página-->
        <!--Container do Spinner do carregamento-->
        <div class="d-flex justify-content-center">
            <!--Div que renderiza o efeito visual de carregamento rotativo-->
            <div class="spinner-border" roler="status" id="loading">
                <!--Texto oculto para leitores de tela indicando estado de carregamento-->
                <span class="sr-only"></span>
            </div> <!--Fechamento do elemento do Spinner-->
        </div> <!--Fechamento do container flex-->
    <!--Rítulo da sessão centralizada usando uma classe utilitária do bootstrap-->
    <p class="h1 text-center">Tarefas de um usuário</p>
        <!--Estrutura da tabela HTML estilizada com as classes utilitárias do bootstrap-->
        <table class="table table-hover" id="tasks">
        <!--Conteudo interno (cabeçalho e linhas) será inserido via Script.js-->
        </table>
        <!--Script para componentes interativos do bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
        <!--Importação do arquivo Script.js próprio contendo lógica de integração com a API-->
        <script src="script.js"></script>
    </body> <!--Fechamento do corpo do Documento-->

</html> <!--Fechamento da tag raiz do HTML-->
